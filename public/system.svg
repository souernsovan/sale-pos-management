<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Primary Accent Gradient (Blue to Indigo) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Secondary Accent Gradient (Emerald to Teal) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Text Dark Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Base Icon Container Background -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#iconBg)" filter="url(#dropShadow)" />

    <!-- Grid / System Network Pattern -->
    <circle cx="30" cy="70" r="2" fill="#334155" />
    <circle cx="50" cy="70" r="2" fill="#334155" />
    <circle cx="70" cy="70" r="2" fill="#334155" />
    <circle cx="30" cy="50" r="2" fill="#334155" />
    <circle cx="70" cy="50" r="2" fill="#334155" />
    
    <!-- Connection Network Lines -->
    <path d="M 30 70 L 50 70 L 70 50" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Sales Analytics Bars -->
    <rect x="25" y="55" width="10" height="20" rx="3" fill="#334155" />
    <rect x="42" y="42" width="10" height="33" rx="3" fill="url(#primaryGrad)" />
    <rect x="59" y="28" width="10" height="47" rx="3" fill="url(#primaryGrad)" />

    <!-- Upward Trend Line / Arrow -->
    <path d="M 22 52 L 40 38 L 54 44 L 74 22" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Arrow Head -->
    <path d="M 64 22 H 74 V 32" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Price Tag / Deal Node Accent -->
    <circle cx="74" cy="22" r="3" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <!-- Main Brand Name -->
  <text x="135" y="62" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="38" 
        fill="url(#textGrad)" 
        letter-spacing="-0.5">Nexus<tspan fill="url(#primaryGrad)">Sales</tspan></text>

  <!-- System Subtitle / Category -->
  <text x="137" y="87" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="600" 
        font-size="13" 
        fill="#64748B" 
        letter-spacing="3.5">MANAGEMENT SYSTEM</text>
</svg>
