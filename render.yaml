databases:
  - name: pos-system-db
    plan: free
    databaseName: pos_system
    user: pos_system

services:
  - type: web
    name: pos-system
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: php artisan migrate --force
    disk:
      name: uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: NexusSales
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: pos-system-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pos-system-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pos-system-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pos-system-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pos-system-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log
